#####################################################################
#   Print Start/End
#####################################################################

[gcode_macro PRINT_START]
gcode:
  {% set EXTRUDER_TEMP = params.EXTRUDER|default(210)|float %}
  {% set BED_TEMP = params.BED|default(50)|float %}
  # Cancel the 30s motor-disable timer armed by PRINT_END: starting a
  # new print within that window used to disable the maglev linear
  # motors mid-start (#30).
  UPDATE_DELAYED_GCODE ID=delay_disable_motor DURATION=0
  LM_ENABLE
  # Heat the bed to the print temperature BEFORE any mesh work (#24), so
  # a MESH_LOAD fallback to BED_MESH_CALIBRATE probes at temperature.
  # The calibrate wrapper waits on this already-set target instead of
  # re-heating to its standalone 70C default (no double-wait).
  M118 Heating bed to {BED_TEMP} ...
  M190 S{BED_TEMP}
  MESH_LOAD
  G28
  G90
  # Nozzle to print temperature after homing/probing and before the
  # purge; previously all heating here was commented out and LINE_PURGE
  # cold-extrude-aborted for any slicer using the advertised
  # PRINT_START EXTRUDER=... BED=... convention (#24).
  M118 Heating nozzle to {EXTRUDER_TEMP} ...
  M109 S{EXTRUDER_TEMP}
  LINE_PURGE

[delayed_gcode delay_disable_motor]
gcode:
    LM_DISABLE

[gcode_macro PRINT_END]
gcode:
  # Heaters and fan off BEFORE any motion: a failed park move must not
  # strand the heaters on an unattended machine (#31).
  M104 S0
  M140 S0
  M106 S0
  # Motion only when homed: CANCEL_PRINT can run before homing completes
  # (heater fault during startup, cancel mid-home), and an unguarded
  # park would abort the cancel chain with "Must home axis first".
  {% if "xyz" in printer.toolhead.homed_axes %}
    # Z lift limited to the available headroom so prints ending near Z
    # max do not abort on "Move out of range" (#31).
    {% set z_lift = [5, printer.toolhead.axis_maximum.z - printer.gcode_move.position.z]|min %}
    G91
    {% if z_lift > 0 %}
      G1 Z{z_lift}
    {% endif %}
    G1 E-5 F300
    G90
    G1 X200 Y10  F12000
  {% endif %}
  UPDATE_DELAYED_GCODE ID=delay_disable_motor DURATION=30

#####################################################################
#   Calibration
#####################################################################

[gcode_macro LEVEL_BED]
description: Auto level bed
gcode:
  QUAD_GANTRY_LEVEL

[gcode_macro CREATE_BED_MESH]
description: Create or update the "default" bed mesh
gcode:
  BED_MESH_CALIBRATE

[gcode_macro FULL_CALIBRATE_BED]
description: Level bed and create or update the "default" mesh
gcode:
  QUAD_GANTRY_LEVEL
  BED_MESH_CALIBRATE

[gcode_macro CALIBRATE_BED]
description: Level bed and create or update the "default" mesh
gcode:
  LM_ENABLE
  M190 S50
  M109 S150
  QUAD_GANTRY_LEVEL_BASE
  BED_MESH_CALIBRATE_BASE

[gcode_macro TUNE_BED_PID]
gcode:
  PID_CALIBRATE HEATER=heater_bed TARGET=60

[gcode_macro TUNE_EXTRUDER_PID]
gcode:
  PID_CALIBRATE HEATER=extruder TARGET=190

#####################################################################
#   Misc. Util.
#####################################################################

# This convinces Klipper the toolhead is at 0,0 and the bed is halfway down.
# Don't break things with this.
[gcode_macro SET_XYZ_POSITION]
description: Tells printer toolhead is at 0,0 and bed is at 150mm.
gcode:
  SET_KINEMATIC_POSITION X=0 Y=0 Z=150

[gcode_macro RUN_INPUT_SHAPER]
description: Currently not recommended due to driver smoothing in effect.
gcode:
  SHAPER_CALIBRATE

[gcode_macro Z_TO_BOTTOM]
description: Homes if not already, then moves Z to bottom.
gcode:
  {% if "z" not in printer.toolhead.homed_axes %}
    G28 Z
  {% endif %}
  G1 Z295

#####################################################################
#   Pause/Resume
#####################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
  {% if printer.pause_resume.is_paused %}
    { action_respond_info("Print already paused") }
  {% elif printer.idle_timeout.state | string == "Printing" and printer.pause_resume.is_paused == False %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE={printer[printer.toolhead.extruder].target}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_fan_speed VALUE={printer["fan"].speed}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_jetstream_speed VALUE={printer["fan_generic Jetstream"].speed}
      BASE_PAUSE
      # Save the paused gcode state (restored by RESUME below); then
      # force absolute mode so the park moves are safe even if the print
      # was in relative mode when the pause hit (#32).
      SAVE_GCODE_STATE NAME=PAUSE_PARK
      G90
      {% set z_lift = [10, printer.toolhead.axis_maximum.z - printer.gcode_move.position.z]|min %}
      G1 Z{printer.gcode_move.position.z + z_lift} F300
      G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000
      M107
      UPDATE_DELAYED_GCODE ID=cool_hot_end DURATION=300
  {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_last_fan_speed: 0
variable_last_jetstream_speed: 0
variable_last_extruder_temp: 0
gcode:
    {% set macro_found = True if printer['gcode_macro _CLIENT_VARIABLE'] is defined else False %}
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
    {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
    {% set sp_move        = velocity if not macro_found else client.speed_move|default(velocity) %}
    ##### end of definitions #####
    # Disarm the pause cool-down timer BEFORE the temperature restore:
    # the delayed_gcode renders its is_paused guard at fire time, so a
    # timer that fires while RESUME is still executing would queue
    # M104 S0 against the resumed print (#48).
    UPDATE_DELAYED_GCODE ID=cool_hot_end DURATION=0
    M109 S{last_extruder_temp}
    M106 S{last_fan_speed*255|int}
    SET_FAN_SPEED FAN=Jetstream SPEED={last_jetstream_speed}
    _CLIENT_EXTRUDE
    # Restore the modal state saved by PAUSE (paired save/restore, #32).
    # Position itself is restored by BASE_RESUME.
    {% if printer.pause_resume.is_paused %}
      RESTORE_GCODE_STATE NAME=PAUSE_PARK
    {% endif %}
    BASE_RESUME VELOCITY={params.VELOCITY|default(sp_move)}

[delayed_gcode cool_hot_end]
gcode:
    {% if printer['pause_resume'].is_paused|int == 1 %}
      M104 S0
    {% endif %}

# Ported from upstream PR mypeopoly/magnetox-os-update#3 (author:
# @nmavor, issue #1). Without this, cancelling a print skipped
# PRINT_END entirely: no park, no heaters-off, no motor-disable timer.
# The cool_hot_end cancel guards against the pause timer firing after
# the cancel (#48).
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel the actual running print
gcode:
  UPDATE_DELAYED_GCODE ID=cool_hot_end DURATION=0
  CLEAR_PAUSE
  SDCARD_RESET_FILE
  PRINT_END
  BASE_CANCEL_PRINT

# Guarded profile load (#33): on a fresh install there is no saved
# "default" profile and an unguarded load would abort PRINT_START.
[gcode_macro MESH_LOAD]
gcode:
    {% if 'default' in printer.bed_mesh.profiles %}
      BED_MESH_PROFILE LOAD=default
    {% else %}
      M118 No saved bed mesh profile "default" - calibrating a new mesh...
      BED_MESH_CALIBRATE
    {% endif %}

#####################################################################
#   Filament Load/Unload
#####################################################################

# Unified filament handling (#2): both macros heat if needed, guard
# against running mid-print (#49), and wrap all moves in
# SAVE/RESTORE_GCODE_STATE so relative-extrusion mode and the E
# coordinate never leak into a print stream. Single extrude-only moves
# rely on max_extrude_only_distance: 250 in [extruder] (#17).

[gcode_macro UNLOAD_FILAMENT]
description: Heat if needed, purge, then cold-pull unload the filament
gcode:
  {% if printer.idle_timeout.state != 'Printing' or printer.pause_resume.is_paused %}
      {% set temp = params.TEMP|default(250)|int %}
      {% set cool = params.COOL_TEMP|default(165)|int %}
      SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_state
      M118 Unloading filament
      M118 Heating nozzle...
      M109 S{temp}
      M83
      G92 E0
      M118 Unloading...
      G0 E40 F360
      G0 E40 F360
      G0 E5 F1200
      M118 Cooling nozzle to {cool} ...
      M106
      M109 S{cool}
      M107
      G0 E-45 F1200
      G0 E-45 F1200
      G0 E-45 F1200
      G0 E-45 F1200
      G92 E0
      M104 S0
      M118 Unload finish
      RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_state
  {% else %}
      M118 Cannot unload filament while printing. Pause the print first.
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Heat if needed, then load filament through the extruder and purge
gcode:
  {% if printer.idle_timeout.state != 'Printing' or printer.pause_resume.is_paused %}
      {% set temp = params.TEMP|default(250)|int %}
      {% set length = params.LENGTH|default(150)|float %}
      {% set purge = params.PURGE|default(30)|float %}
      {% set speed = params.SPEED|default(300)|int %}
      {% set prev_target = printer[printer.toolhead.extruder].target|int %}
      SAVE_GCODE_STATE NAME=LOAD_FILAMENT_state
      M118 Loading filament
      {% if printer[printer.toolhead.extruder].temperature < temp %}
        M118 Heating nozzle...
        M109 S{temp}
      {% endif %}
      M83
      G92 E0
      M118 Loading...
      G1 E{length} F600 # transit to the nozzle
      G1 E{purge} F{speed} # purge
      G92 E0
      M104 S{prev_target}
      M118 Load finish
      RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_state
  {% else %}
      M118 Cannot load filament while printing. Pause the print first.
  {% endif %}

#####################################################################
#   Renamed
#####################################################################

# Wrappers forward caller params via {rawparams} (#36) -- PROFILE=,
# mesh bounds, KAMP areas etc. used to be dropped on the floor -- and
# preheat the bed before probing (thermal expansion materially changes
# the result). The M118 breadcrumb before the trailing G28 Z lets users
# tell a calibration failure from a re-home failure (#45).
[gcode_macro BED_MESH_CALIBRATE]
rename_existing:BED_MESH_CALIBRATE_BASE
gcode:
  {% if "z" not in printer.toolhead.homed_axes %}
    G28 Z
  {% endif %}
  # If a caller (e.g. PRINT_START, #24) already set a bed target, wait
  # on that instead of forcing the standalone 70C default -- the
  # higher-level temperature wins and the bed is only waited on once.
  {% if printer.heater_bed.target > 0 %}
    M118 Waiting for the bed to reach its set temperature...
    M190 S{printer.heater_bed.target}
  {% else %}
    M118 Heating the bed, please wait...
    M190 S70
  {% endif %}
  M118 Complete heating and start executing bed mesh calibrate
  BED_MESH_CALIBRATE_BASE {rawparams}
  M118 Bed mesh calibration complete, re-homing Z
  G28 Z

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: QUAD_GANTRY_LEVEL_BASE
gcode:
  G28
  # Same caller-set-target logic as the BED_MESH_CALIBRATE wrapper.
  {% if printer.heater_bed.target > 0 %}
    M118 Waiting for the bed to reach its set temperature...
    M190 S{printer.heater_bed.target}
  {% else %}
    M118 Heating the bed, please wait...
    M190 S70
  {% endif %}
  M118 Complete heating and start executing quad gantry level
  QUAD_GANTRY_LEVEL_BASE {rawparams}
  M118 Quad gantry level complete, re-homing Z
  G28 Z

#####################################################################
#   Fan Shenanagins
#####################################################################

# Fan index routing (#34): P2 is the Jetstream auxiliary fan; P0/P1
# (emitted by several slicers for the part-cooling fan) and no-P all go
# to the part fan. The old wrapper silently discarded P0/P1 commands.
[gcode_macro M106]
rename_existing: G106
gcode:
    {% if params.P is defined and params.P|int == 2 %}
        {% if params.S is defined %}
            {% if params.S|int == 255 %}
                {% set realspeed = 1 %}
            {% else %}
                {% if params.S|int == 0 %}
                    {% set realspeed = 0 %}
                {% else %}
                    {% set realspeed = params.S|float/255 %}
                {% endif %}
            {% endif %}
        {% else %}
            {% set realspeed = 1 %}
        {% endif %}

        SET_FAN_SPEED FAN=Jetstream SPEED={realspeed}
    {% else %}
        {% if params.S is defined %}
          G106 S{params.S}
        {% else %}
          G106 S255
        {% endif %}
    {% endif %}

[gcode_macro M107]
rename_existing: G107
gcode:
    {% if params.P is defined %}
      {% if params.P|int == 2 %}
        SET_FAN_SPEED FAN=Jetstream SPEED=0
      {% else %}
        G107
      {% endif %}
    {% else %}
      SET_FAN_SPEED FAN=Jetstream SPEED=0
      G107
    {% endif %}

#####################################################################
#   OS Update
#####################################################################

# NOTE (#8): the OTA self-update flow used to hard-clone the abandoned
# upstream repo (https://github.com/mypeopoly/magnetox-os-update), which
# would clobber every fix in this monorepo. The clone URLs below are
# PLACEHOLDERS pointing at this fork (https://github.com/dev-dull/magneto-x)
# -- update.sh does NOT yet understand this repo's magnetox-os-update/
# subdirectory layout -- and the update flow is DISABLED pending the
# update-channel redesign tracked in issue #14. _UPDATE_OS and
# _UPDATE_OS_DEV exit early with a warning instead of running.

[gcode_shell_command RM_UPDATE]
command: rm -rf /home/pi/magnetox-os-update
timeout: 2.
verbose: True

[gcode_shell_command GIT_CLONE_DEV]
# PLACEHOLDER (#8/#14): do not use until the update flow is redesigned.
command: git clone -b dev https://github.com/dev-dull/magneto-x /home/pi/magnetox-os-update
timeout: 150.
verbose: True

[gcode_shell_command GIT_CLONE]
# PLACEHOLDER (#8/#14): do not use until the update flow is redesigned.
command: git clone -b main https://github.com/dev-dull/magneto-x /home/pi/magnetox-os-update
timeout: 150.
verbose: True

[gcode_shell_command CHMOD_E]
command: chmod +x /home/pi/magnetox-os-update/update.sh
timeout: 3.
verbose: True

[gcode_shell_command  UPDATE_OS_CMD]
command: sh /home/pi/magnetox-os-update/update.sh
timeout: 600.
verbose: True

[gcode_macro _UPDATE_OS_DEV]
gcode:
  M118 WARNING: OS self-update is disabled in this fork pending the update-channel redesign (dev-dull/magneto-x issue 14). No update was performed.
  # Disabled pending #14 -- see the note above.
  # RUN_SHELL_COMMAND CMD=RM_UPDATE
  # RUN_SHELL_COMMAND CMD=GIT_CLONE_DEV
  # RUN_SHELL_COMMAND CMD=CHMOD_E
  # RUN_SHELL_COMMAND CMD=UPDATE_OS_CMD

[gcode_macro _UPDATE_OS]
gcode:
  M118 WARNING: OS self-update is disabled in this fork pending the update-channel redesign (dev-dull/magneto-x issue 14). No update was performed.
  # Disabled pending #14 -- see the note above.
  # RUN_SHELL_COMMAND CMD=RM_UPDATE
  # RUN_SHELL_COMMAND CMD=GIT_CLONE
  # RUN_SHELL_COMMAND CMD=CHMOD_E
  # RUN_SHELL_COMMAND CMD=UPDATE_OS_CMD

#####################################################################
#   Gcode Shell Commands
#####################################################################

[gcode_shell_command  MOTOR_CONTROL]
command: curl -G http://127.0.0.1:8880/motor_control
timeout: 2.
verbose: True

[gcode_macro LINEAR_MOTOR_CONTROL]
gcode:
  RUN_SHELL_COMMAND CMD=MOTOR_CONTROL

[gcode_shell_command  GET_MIRROR_VERSION]
command: curl -G http://127.0.0.1:8880/get_os_version
timeout: 2.
verbose: True

[gcode_macro MAGNETO_OS_VERSION]
gcode:
  RUN_SHELL_COMMAND CMD=GET_MIRROR_VERSION

[gcode_shell_command  RESIZE_FILE_SYSTEM]
command: curl -G http://127.0.0.1:8880/auto_resize_filesystem
timeout: 2.
verbose: False

[gcode_macro RESIZE_FILESYSTEM]
gcode:
  RUN_SHELL_COMMAND CMD=RESIZE_FILE_SYSTEM

# X/Y motion depends on the maglev linear motors being enabled, and
# this enable chain used to fail with zero user-visible indication
# (#40): verbose output and a longer timeout make failures loud.
[gcode_shell_command LINEAR_MOTOR_ENABLE]
command: curl -G http://127.0.0.1:8880/send_command?command=ENABLE
timeout: 10.
verbose: True

[gcode_shell_command LINEAR_MOTOR_DISABLE]
command: curl -G http://127.0.0.1:8880/send_command?command=DISABLE
timeout: 10.
verbose: True

# Legacy name kept for compatibility ("LINER" was a typo upstream);
# both names now share the single LINEAR_MOTOR_* shell command pair.
[gcode_macro LINER_MOTOR]
gcode:
  {% if params.ENABLE is defined %}
    {% if params.ENABLE|int == 0 %}
      RUN_SHELL_COMMAND CMD=LINEAR_MOTOR_DISABLE
    {% else %}
      RUN_SHELL_COMMAND CMD=LINEAR_MOTOR_ENABLE
    {% endif %}
  {% else %}
    RUN_SHELL_COMMAND CMD=LINEAR_MOTOR_ENABLE
  {% endif %}

[gcode_macro LM_ENABLE]
gcode:
  # Enabling the motors must also disarm any pending disable timer (#30).
  UPDATE_DELAYED_GCODE ID=delay_disable_motor DURATION=0
  G4 P500
  RUN_SHELL_COMMAND CMD=LINEAR_MOTOR_ENABLE

[gcode_macro LM_DISABLE]
gcode:
  RUN_SHELL_COMMAND CMD=LINEAR_MOTOR_DISABLE

#####################################################################
#   Hidden
#####################################################################

[gcode_macro _RESIZE_FILESYSTEM]
gcode:
  RUN_SHELL_COMMAND CMD=RESIZE_FILE_SYSTEM

[gcode_macro _RUNOUT_PAUSE]
gcode:
  M118 Filament runout triggered, pausing
  PAUSE

[gcode_macro _MESH_LOAD]
gcode:
    {% if 'default' in printer.bed_mesh.profiles %}
      BED_MESH_PROFILE LOAD=default
    {% else %}
      M118 No saved bed mesh profile "default" - calibrating a new mesh...
      BED_MESH_CALIBRATE
    {% endif %}

[gcode_macro _LINEAR_MOTOR]
gcode:
  {% if params.ENABLE is defined %}
    {% if params.ENABLE|int == 0 %}
      RUN_SHELL_COMMAND CMD=LINEAR_MOTOR_DISABLE
    {% else %}
      RUN_SHELL_COMMAND CMD=LINEAR_MOTOR_ENABLE
    {% endif %}
  {% else %}
    RUN_SHELL_COMMAND CMD=LINEAR_MOTOR_ENABLE
  {% endif %}

[gcode_macro _LM_ENABLE]
gcode:
  # Enabling the motors must also disarm any pending disable timer (#30).
  UPDATE_DELAYED_GCODE ID=delay_disable_motor DURATION=0
  RUN_SHELL_COMMAND CMD=LINEAR_MOTOR_ENABLE

[gcode_macro _LM_DISABLE]
gcode:
  RUN_SHELL_COMMAND CMD=LINEAR_MOTOR_DISABLE

#####################################################################
#   Motion Tests
#####################################################################

[gcode_macro TEST_X_MOVE]
gcode:
    # Speed
    {% set speed  = params.SPEED|default(400)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(10)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(10000)|int %}
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    G28
    G1 Z20 F300
    {% for i in range(iterations) %}
        G0 X50 Y150 F{speed*60}
        G0 X290 Y150 F{speed*60}
    {% endfor %}

[gcode_macro TEST_X_MOVE_START]
gcode:
    # Speed
    {% set speed  = params.SPEED|default(400)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(10)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(10000)|int %}
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    G28
    G1 Z20 F300
    {% for i in range(iterations) %}
        G0 X10 Y150 F{speed*60}
        G0 X180 Y150 F{speed*60}
    {% endfor %}

[gcode_macro TEST_X_MOVE_END]
gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    G28
    G1 Z20 F300
    {% for i in range(iterations) %}
        G0 X160 Y150 F{speed*60}
        G0 X280 Y150 F{speed*60}
    {% endfor %}

[gcode_macro TEST_Y_MOVE]
gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    G28
    G1 Z20 F300
    {% for i in range(iterations) %}
        G0 X100 Y50 F{speed*60}
        G0 X100 Y350 F{speed*60}
    {% endfor %}

[gcode_macro TEST_Z_MOVE]
gcode:
    # Speed
    {% set speed  = params.SPEED|default(20)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(3)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    G28
    {% for i in range(iterations) %}
        G0 Z10 F{speed*60}
        G0 Z266 F{speed*60}
    {% endfor %}

# [gcode_macro M300]
# description: Enables M300 commands
# gcode:
#   #use a default 1kHz tone if S is omitted
#   {% set S = params.S|default(1000)|int %}
#   #use a 10ms duration if P is omitted
#   {% set P = params.P|default(10)|int %}
#   SET_PIN PIN=beeper_pin VALUE=0.5 CYCLE_TIME={1.0/S if S > 0 else 1}
#   G4 P{P}
#   SET_PIN PIN=beeper_pin VALUE=0
