# Build and publish the Magneto X OTA payload when a v* tag is pushed.
name: release-ota

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Guarded to the canonical repo so forks don't publish releases by accident.
    if: github.repository == 'dev-dull/magneto-x'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build OTA payload
        run: bash scripts/build-ota-payload.sh "${GITHUB_REF_NAME}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/magneto-x-ota-${GITHUB_REF_NAME}.tar.gz" \
            "dist/manifest.json" \
            --title "Magneto X OTA ${GITHUB_REF_NAME}" \
            --generate-notes
